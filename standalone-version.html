function inbox(){const l=[...msgs].sort((a,b)=>b.id-a.id);return`<div class="card"><h2>✉️ Messages (${msgs.filter(m=>!m.reply).length} unanswered)</h2>${l.length?l.map(m=>`<div class="item"><h3>${esc(m.s)}</h3><p>from ${esc(m.name)} (${esc(m.uid)}) · ${esc(m.d)}</p><p class="pw" style="color:var(--ink)">${esc(m.t)}</p>${m.reply?`<div class="rep"><b>Your reply</b><p class="pw" style="color:var(--ink)">${esc(m.reply)}</p></div>`:""}<textarea id="r${m.id}" rows="2" placeholder="Write a reply…"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" onclick="replyMsg(${m.id})">${m.reply?"Update reply":"Reply"}</button><button class="btn bad sm" onclick="delMsg(${m.id})">Delete</button></div></div>`).join(""):"<p>No messages.</p>"}</div>`}
function replyMsg(id){const t=$("#r"+id).value.trim();if(!t)return;const m=msgs.find(x=>x.id===id);m.reply=t;m.seen=0;save();render()}
function delMsg(id){if(!confirm("Delete this message?"))return;msgs=msgs.filter(m=>m.id!==id);save();render()}
function help(){return`<button class="back" onclick="go('home')">← Back</button><div class="card"><h2>❓ Help &amp; tips</h2>

<div class="item"><h3>Your data</h3><p>This prototype stores data in your browser only, so clearing browser data removes your account.</p></div>
<button class="btn" onclick="go('msg')">Message the admin</button></div>`}
